<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>כניסה למערכת המאפייה · לחם ושמש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-bg:#FDFBF7;
    --color-bg-alt:#F5EFE3;
    --color-text:#4A3525;
    --color-text-soft:#7A6350;
    --color-accent:#D97706;
    --color-accent-dark:#B15E05;
    --color-border:#E7DFCF;
    --color-error:#B3261E;
    --color-error-bg:#FBEAE9;
    --font-display:"Suez One","Segoe UI",Arial,sans-serif;
    --font-body:"Heebo","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--font-body);
    background:var(--color-bg);
    color:var(--color-text);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 18px 48px;
  }
  .back{
    width:100%;
    max-width:420px;
    margin-bottom:12px;
    font-size:14px;
  }
  .back a{
    display:inline-flex;
    align-items:center;
    min-height:44px;
    color:var(--color-text);
    text-underline-offset:3px;
  }
  header{width:100%;max-width:420px;text-align:center;margin-bottom:20px;}
  header img{width:64px;height:64px;display:block;margin:0 auto 10px;border-radius:50%;}
  h1{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0 0 4px;}
  header p{margin:0;font-size:14px;color:var(--color-text-soft);}
  main{
    width:100%;
    max-width:420px;
    background:#fff;
    border:1px solid var(--color-border);
    border-radius:18px;
    padding:22px;
    box-shadow:0 2px 4px rgba(74,53,37,.04), 0 10px 28px rgba(74,53,37,.06);
  }
  .field{display:grid;gap:6px;margin-bottom:16px;}
  label{font-weight:700;font-size:14px;}
  input{
    width:100%;
    min-height:48px;
    padding:10px 12px;
    font:inherit;
    font-size:16px;
    color:var(--color-text);
    background:var(--color-bg);
    border:1px solid var(--color-border);
    border-radius:10px;
  }
  input:focus-visible,
  button:focus-visible,
  .back a:focus-visible{outline:3px solid var(--color-accent);outline-offset:2px;}
  input[aria-invalid="true"]{border-color:var(--color-error);}
  .btn{
    width:100%;
    min-height:48px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--color-accent);
    color:#fff;
    font:inherit;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .btn:hover:not(:disabled){background:var(--color-accent-dark);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .error-box{
    margin:0 0 16px;
    padding:12px 14px;
    background:var(--color-error-bg);
    border:1px solid #F3C6C3;
    border-radius:10px;
    color:var(--color-error);
    font-size:14px;
    line-height:1.6;
  }
  .error-box[hidden]{display:none;}
  footer{margin-top:20px;text-align:center;font-size:12px;color:var(--color-text-soft);}
</style>
</head>
<body>

<p class="back"><a href="/">חזרה לאתר</a></p>

<header>
  <img src="https://res.cloudinary.com/hno6nbir/image/upload/f_auto,q_auto,w_150/lechem-veshemesh/branding/logo.png" alt="לוגו לחם ושמש" width="64" height="64">
  <h1>כניסה למערכת המאפייה</h1>
  <p>לצוות המאפייה בלבד.</p>
</header>

<main>
  <form id="loginForm" novalidate>
    <div class="error-box" id="loginError" role="alert" hidden></div>

    <div class="field">
      <label for="username">שם משתמש</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>

    <div class="field">
      <label for="password">סיסמה</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <button class="btn" id="loginSubmit" type="submit">כניסה</button>
  </form>
</main>

<footer>לחם ושמש · מערכת מסמכים אוטומטית</footer>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var usernameInput = document.getElementById('username');
  var passwordInput = document.getElementById('password');
  var submitBtn = document.getElementById('loginSubmit');
  var errorBox = document.getElementById('loginError');
  var isSubmitting = false;

  var MESSAGES = {
    invalid_credentials: 'שם המשתמש או הסיסמה שגויים. אפשר לנסות שוב.',
    too_many_attempts: 'היו יותר מדי ניסיונות. אפשר לנסות שוב בעוד כמה דקות.',
    not_configured: 'הכניסה עוד לא הוגדרה במערכת. יש לפנות למנהל האתר.',
    empty: 'צריך למלא שם משתמש וסיסמה.',
    network: 'לא הצלחנו להתחבר לשרת. אפשר לנסות שוב.'
  };

  function showError(code) {
    errorBox.textContent = MESSAGES[code] || MESSAGES.network;
    errorBox.hidden = false;
    usernameInput.setAttribute('aria-invalid', code === 'invalid_credentials' || code === 'empty' ? 'true' : 'false');
    passwordInput.setAttribute('aria-invalid', code === 'invalid_credentials' || code === 'empty' ? 'true' : 'false');
  }

  function clearError() {
    errorBox.hidden = true;
    errorBox.textContent = '';
    usernameInput.removeAttribute('aria-invalid');
    passwordInput.removeAttribute('aria-invalid');
  }

  function setSubmitting(state) {
    isSubmitting = state;
    submitBtn.disabled = state;
    submitBtn.textContent = state ? 'בודק...' : 'כניסה';
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (isSubmitting) return;
    clearError();

    var username = usernameInput.value.trim();
    var password = passwordInput.value;
    if (!username || !password) {
      showError('empty');
      (username ? passwordInput : usernameInput).focus();
      return;
    }

    setSubmitting(true);
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (response) {
        return response.json().catch(function () { return {}; }).then(function (body) {
          return { ok: response.ok, body: body };
        });
      })
      .then(function (result) {
        if (result.ok && result.body && result.body.ok) {
          window.location.href = '/admin';
          return;
        }
        showError((result.body && result.body.code) || 'network');
        passwordInput.value = '';
        passwordInput.focus();
        setSubmitting(false);
      })
      .catch(function () {
        showError('network');
        setSubmitting(false);
      });
  });
})();
</script>

</body>
</html>
